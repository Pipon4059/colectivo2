<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El colectivo | Administracion</title>
    <link rel="stylesheet" href="css/styles.css?v=10">
</head>
<body>
    <main class="main-login">
        <section class="login-right">
            <div>
                <img src="img/elcolectivo-logo.png" alt="El colectivo" class="logo">
                <h2>Administracion</h2>
                <p class="subtitle">Acceso exclusivo para administradores.</p>
            </div>
        </section>

        <section class="login-form">
            <div class="login-content">
                <h2>Iniciar sesion</h2>
                <p id="mensaje-admin" class="mensaje"></p>

                <form action="backend/admin-login.php" method="POST">
                    <input type="email" name="email" placeholder="Correo del administrador" required>
                    <input type="password" name="password" placeholder="Contraseña" required>
                    <button type="submit" class="login-btn">Ingresar</button>
                </form>

                <a href="login.html">Volver al acceso de usuarios</a>
            </div>
        </section>
    </main>

    <script src="js/admin-login.js?v=1"></script>
</body>
</html>
